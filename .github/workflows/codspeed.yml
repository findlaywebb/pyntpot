name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger backtest runs to build an initial history.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: "0.11.21"
          python-version: "3.13"

      - name: Sync
        run: uv sync --locked

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5.4.0
        with:
          mode: simulation
          run: uv run pytest tests/benchmarks --codspeed
