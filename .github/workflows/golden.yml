name: Golden

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Exact golden comparison is the local gate only: a CI runner's OS or BLAS build is not
# guaranteed to match the machine the goldens were made on, bit for bit.
jobs:
  golden:
    # Kept to the OS alone, so the matrix's `workers` key does not rename the checks.
    name: golden (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        # A worker peaks near 3 GB on the biggest paints; macos-15 has 3 cores and 7 GB, so it
        # runs two workers rather than one per core.
        include:
          - os: macos-15
            workers: 2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          version: "0.11.21"

      - name: Sync
        run: uv sync --locked

      # The arm64 check of issue #86: the three pinned-hash tests fail exact on Apple Silicon,
      # so they run here in tolerance mode, where a wrong bound fails them (ADRs 0030, 0051).
      # They are not marked golden, so the parity step below does not select them.
      - name: Pinned plate hashes (arm64, tolerance)
        if: matrix.os == 'macos-15'
        run: >-
          uv run pytest --golden-tolerance
          "tests/unit/ink/test_paper.py::TestClassicEdge::test_the_classic_plate_is_the_pinned_one"
          "tests/unit/maps/painter/test_smoke.py::test_the_flags_off_still_paint_the_plates_that_were_approved"
          "tests/unit/maps/painter/test_smoke.py::test_the_wash_flags_off_still_paint_the_plates_that_were_approved"

      - name: Golden parity (tolerance)
        run: uv run pytest -m golden --golden-tolerance -n ${{ matrix.workers || 'auto' }} --dist loadgroup --basetemp=${{ runner.temp }}/pytest

      # A failing fresh paint is only inspectable if its pictures outlive the runner.
      - name: Keep the fresh paints
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: golden-paints-${{ matrix.os }}
          # The painted images only, not the copied fixture caches. The Lynmouth paint dirs
          # are left out: the parity pin copies each output into its `fresh` tree, which is kept.
          path: |
            ${{ runner.temp }}/pytest/**/*.png
            ${{ runner.temp }}/pytest/**/*.webp
            !${{ runner.temp }}/pytest/**/lynmouth*/**
          retention-days: 7

      # Diff images of each fresh paint past the parity bound (ADR 0052). The parity and docs
      # pins copy what they gate into `fresh` trees at the repository paths (in tolerance
      # mode, the Lynmouth outputs and the docs masters; never the lossy docs files, which
      # this gate does not check); merged, they are the later side and the checkout the
      # earlier. Bare `--min-fraction` leaves out changes within the parity bound
      # (`MAX_DIFFERING_FRACTION`), so only the failing images are drawn.
      - name: Diff the fresh paints
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p "$RUNNER_TEMP/fresh"
          for tree in $(find "$RUNNER_TEMP/pytest" -type d -name 'fresh*' -prune); do
            cp -R "$tree/." "$RUNNER_TEMP/fresh/"
          done
          PYTHONPATH=tests uv run python tests/golden/diff_images.py "$RUNNER_TEMP/golden-diffs" \
            --before . --after "$RUNNER_TEMP/fresh" --min-fraction

      - name: Keep the diff images
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: golden-diffs-${{ matrix.os }}
          path: ${{ runner.temp }}/golden-diffs
          if-no-files-found: ignore
          retention-days: 7
