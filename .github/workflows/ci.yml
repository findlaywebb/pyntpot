name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: "0.11.21"
          python-version: ${{ matrix.python-version }}

      # Abort the sync before any malicious code runs if a locked package matches an
      # OSV MAL advisory (uv's opt-in malware check).
      - name: Sync
        run: uv sync --locked --preview-features malware-check
        env:
          UV_MALWARE_CHECK: "1"

      # Fail the build on any known advisory in uv.lock (scanned against OSV).
      - name: Audit dependencies
        run: uv audit --preview-features audit-command

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types (ty)
        run: uv run ty check

      - name: Boundaries (import-linter)
        run: uv run lint-imports

      - name: Tests
        run: uv run pytest -m "not golden and not benchmark" --cov

      - name: Coverage gate (ink, letters)
        run: uv run coverage report --include="src/pyntpot/ink/*,src/pyntpot/letters/*" --fail-under=95 --precision=2

      - name: Coverage gate (maps)
        run: uv run coverage report --include="src/pyntpot/maps/*" --fail-under=92 --precision=2

      - name: Benchmarks (smoke)
        run: uv run pytest -m benchmark

  # Mutation testing on the functions this pull request changed (ADR 0012). The nightly
  # in mutation-nightly.yml covers the whole scope.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: "0.11.21"

      - name: Sync
        run: uv sync --locked

      - name: Changed functions
        run: uv run python tests/mutation/scope.py --base origin/${{ github.base_ref }} --out "$RUNNER_TEMP/patterns"

      # `shell: bash` is `bash -eo pipefail`: inside the `if` condition `-e` does not fire,
      # and `pipefail` carries mutmut's failure through `tee`.
      - name: Mutation run
        id: run
        shell: bash
        run: |
          if [ ! -s "$RUNNER_TEMP/patterns" ]; then echo "no changed functions in the mutation scope"; echo tested=false >> "$GITHUB_OUTPUT"; exit 0; fi
          if xargs -r -a "$RUNNER_TEMP/patterns" uv run mutmut run 2>&1 | tee "$RUNNER_TEMP/mutmut.log"; then
            echo tested=true >> "$GITHUB_OUTPUT"
          elif grep -q 'Filtered for specific mutants, but nothing matches' "$RUNNER_TEMP/mutmut.log"; then
            echo "changed functions have no mutants"; echo tested=false >> "$GITHUB_OUTPUT"
          else exit 1; fi

      - name: Export stats
        if: steps.run.outputs.tested == 'true'
        run: uv run mutmut export-cicd-stats

      # After a restricted run every untested mutant is `not checked`; keep the tested ones.
      - name: Results
        if: steps.run.outputs.tested == 'true'
        run: |
          uv run mutmut results | { grep -v ': not checked$' || true; }

      - name: Score
        if: steps.run.outputs.tested == 'true'
        run: uv run python tests/mutation/score.py mutants/mutmut-cicd-stats.json

  prerelease:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.21"
          python-version: "3.15"

      - name: Sync
        run: |
          uv sync --locked --no-dev
          uv pip install pytest hypothesis pytest-randomly pytest-benchmark

      - name: Tests
        run: uv run --no-sync pytest -m "not golden"
