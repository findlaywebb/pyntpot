name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: "0.11.21"
          python-version: ${{ matrix.python-version }}

      # Abort the sync before any malicious code runs if a locked package matches an
      # OSV MAL advisory (uv's opt-in malware check).
      - name: Sync
        run: uv sync --locked --preview-features malware-check
        env:
          UV_MALWARE_CHECK: "1"

      # Fail the build on any known advisory in uv.lock (scanned against OSV).
      - name: Audit dependencies
        run: uv audit --preview-features audit-command

      - name: Hooks
        run: uv run prek run --all-files

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types (ty)
        run: uv run ty check

      - name: Boundaries (import-linter)
        run: uv run lint-imports

      # Tolerance mode: the smoke box's exact bytes are pinned on the machine that made them, and a
      # runner's numpy may round the wash a last bit differently (ADR 0030).
      - name: Tests
        run: uv run pytest -m "not golden and not benchmark" --cov --golden-tolerance

      - name: Coverage gate (ink, letters)
        run: uv run coverage report --include="src/pyntpot/ink/*,src/pyntpot/letters/*" --fail-under=95 --precision=2

      - name: Coverage gate (maps)
        run: uv run coverage report --include="src/pyntpot/maps/*" --fail-under=92 --precision=2

      - name: Benchmarks (smoke)
        run: uv run pytest -m benchmark

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          version: "0.11.21"
          python-version: "3.13"

      - name: Sync
        run: uv sync --locked

      # Offline: relative links and fragments only; the weekly links.yml checks the web.
      - name: Links (lychee, offline)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --config lychee.toml README.md docs
          fail: true

      - name: Build
        run: uv build

      - name: Package description (twine)
        run: uv run twine check --strict dist/*

  prerelease:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.32"
          python-version: "3.15"

      - name: Sync
        run: |
          uv sync --locked --no-dev
          uv pip install pytest hypothesis pytest-randomly pytest-benchmark

      - name: Tests
        run: uv run --no-sync pytest -m "not golden" --golden-tolerance
