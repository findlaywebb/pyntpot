name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.21"

      - name: Tag matches the project version
        run: |
          version="$(uv version --short)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} is not v${version}" >&2
            exit 1
          fi

      - name: Sync
        run: uv sync --locked

      - name: Hooks
        run: uv run prek run --all-files

      - name: Tests
        run: uv run pytest -m "not golden and not benchmark"

      # Never the exact goldens on a runner (ADR 0030).
      - name: Goldens
        run: uv run pytest -m golden --golden-tolerance

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.3

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Changelog section as release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v header="## [${version}]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Create the GitHub release
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --verify-tag
          --title "${GITHUB_REF_NAME}"
          --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
