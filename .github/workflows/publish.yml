name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.3

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.21"

      - name: Build
        run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
