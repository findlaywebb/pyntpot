# git-cliff drafts a release's CHANGELOG.md section from the squash-merged PR titles on
# main (ADR 0042). Run: uvx git-cliff@2.14.2 --unreleased --tag vX.Y.Z
# The draft is edited by hand before the release PR merges.

[changelog]
header = ""
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% set breaking = commits | filter(attribute="breaking", value=true) %}
{%- if breaking | length > 0 %}
### Breaking changes
{% for commit in breaking %}
- {% if commit.scope %}`{{ commit.scope }}`: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endif %}
{%- for group, group_commits in commits | filter(attribute="breaking", value=false) | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in group_commits %}
- {% if commit.scope %}`{{ commit.scope }}`: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = true
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 3 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^refactor", skip = true },
  { message = "^docs", skip = true },
  { message = "^test", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },
]
