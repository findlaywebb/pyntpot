# The curated callouts of the showcase place cards, one table per place (the name of its
# fixture directory), read by examples/place_card.py and tests/golden/test_places.py.
#
# A callout is a name, lettered exactly as written, with the latitude and longitude of
# its OpenStreetMap element (a node's own point, or the centre of a way or relation's
# geometry), so it is lettered even where the element is not among the map's landmark
# candidates. The callouts are in priority order: the cap on lettered names is the
# theme's `label_max`, and the placer may still drop one it cannot fit. A journal note is
# a sentence of the walker's own pinned to a point, at most 60 characters.
#
# Tŷ Melin Bakery is not mapped under its own name. Its point is OpenStreetMap node
# 5560350617, the bakery's address at 54 Frogmore Street (see tests/fixtures/y-fenni/README.md).

[ambleside]
callouts = [
    { name = "Bridge House", lat = 54.433168, lng = -2.963484 },
    { name = "Rydal Water", lat = 54.447436, lng = -2.992923 },
    { name = "Loughrigg Terrace", lat = 54.442324, lng = -3.015681 },
    { name = "Rydal Cave", lat = 54.4431789, lng = -2.9965662 },
]

