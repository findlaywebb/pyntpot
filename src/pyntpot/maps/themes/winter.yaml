# yaml-language-server: $schema=theme.schema.json
# Winter: the default theme under snow. Pale blue-white paper without foxing, washes in cool greys
# and blues, grey-brown roads and a scarlet route ink that stands out from the white. It overrides
# the paper, the cover pigments, the brush ids, the lettering inks and the route ink.

paper:
  paper_hex: "#f0f4f7"
  paper_worn: 0.1
  paper_vignette: 0.07
  paper_foxing: 0.0

wash:
  separation_pigments:
    wood: "#4f6b86"

brush:
  brushes:
    lane: TRK4-c
    road_major: MAJ2-d
    track: TRK4-c

nib:
  label_ink: "#1e2a38"
  label_route_ink: "#b3261a"
  label_water_ink: "#2f6a9a"
  label_in_water_ink: "#f4f8fb"

cover:
  pigments:
    built: "#c9d0d8"
    farmland: "#e4eaef"
    heath: "#d3dce4"
    meadow: "#dbe5ec"
    orchard: "#d8e2e8"
    pale: "#dfe7ee"
    relief: "#9fb0c0"
    rim: "#a9b8c6"
    rock: "#cfd6dc"
    sand: "#e6ebef"
    scrub: "#c9d6de"
    water: "#8fb8d8"
    wetland: "#c3d5de"
    wood: "#6f8696"
    works: "#c3cad2"

route_ink:
  px: 5.6
  colour: "#c8321e"
