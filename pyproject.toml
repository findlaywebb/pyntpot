[project]
name = "pyntpot"
version = "0.1.0"
description = "Hand-drawn watercolour and pen-and-ink painting for Python, with route maps"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "LICENSE-FONT"]
authors = [{ name = "Findlay Webb" }]
keywords = ["watercolour", "pen-and-ink", "painting", "maps", "gpx", "raster"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "fonttools>=4.63.0",
    "httpx>=0.28",
    "pydantic>=2.13",
]

[project.scripts]
pyntpot = "pyntpot.maps.cli:main"

[project.urls]
Homepage = "https://github.com/findlaywebb/pyntpot"
Repository = "https://github.com/findlaywebb/pyntpot"
Issues = "https://github.com/findlaywebb/pyntpot/issues"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9",
    "hypothesis>=6.168",
    "pytest-randomly>=4.1",
    "pytest-cov>=7.1",
    "pytest-benchmark>=5.3",
    "pytest-codspeed>=5.0",
    "mutmut>=3.8",
    "import-linter>=2.11",
    "ruff>=0.15",
    "ty>=0.0.49",
    "vulture>=2.16",
]

# ---------------------------------------------------------------------------
# Boundary contract — dependencies point inward (docs/decisions/0002)
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = ["pyntpot"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "No plotting, dataframe, template or YAML dependencies"
type = "forbidden"
source_modules = ["pyntpot"]
forbidden_modules = ["matplotlib", "pandas", "jinja2", "yaml"]

[[tool.importlinter.contracts]]
name = "Layers: maps -> letters -> ink"
type = "layers"
layers = ["pyntpot.maps", "pyntpot.letters", "pyntpot.ink"]

[[tool.importlinter.contracts]]
name = "ink and letters stay free of httpx and pydantic"
type = "forbidden"
source_modules = ["pyntpot.ink", "pyntpot.letters"]
forbidden_modules = ["httpx", "pydantic"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src"]
# .claude/ holds vendored agent skills/agents (their own scripts, not app code) —
# keep them out of the app's lint gates.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "A",        # flake8-builtins — agents shadow id/type/list reflexively
    "ANN",      # annotations everywhere — ty is the sole type gate; gaps weaken it
    "ASYNC",    # flake8-async
    "B",        # flake8-bugbear
    "BLE",      # no blind except — fail loud, never swallow
    "C4",       # flake8-comprehensions
    "C90",      # mccabe complexity
    "D",        # pydocstyle — docstring *presence*; contract-quality is handwritten
    "DTZ",      # naive-datetime ban — backs the canonical-UTC timestamp rule
    "ERA",      # no commented-out code — delete it, git remembers
    "FBT",      # boolean traps — flags become keyword-only
    "G",        # logging format
    "ICN",      # import naming conventions
    "ISC",      # implicit str concat — the missing-comma-in-a-list bug
    "N",        # pep8 naming
    "PL",       # full pylint set (PLC/PLE/PLR/PLW)
    "PTH",      # pathlib over os.path
    "RET",      # flake8-return
    "SIM",      # flake8-simplify
    "T20",      # no print — lint-speed twin of the architecture AST test
    "TC",       # type-checking import placement
    "TID",      # tidy imports + banned APIs below
    "TRY",      # tryceratops — bad exception patterns
    "FURB",     # refurb — idiomatic Python
    "RUF",      # ruff-native
]
ignore = [
    "E501",     # line length is the formatter's job
    "TRY003",   # long exception messages are fine
    "ISC001",   # conflicts with the ruff formatter
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
max-args = 6
max-branches = 10
max-returns = 5
max-statements = 40

# `support` (tests/support, reached via the pytest `pythonpath` setting below,
# not an installed package) would otherwise land in the same "first-party" isort bucket
# as `pyntpot.*` and sort alphabetically against it — stable only by luck of the
# package name. Giving it its own local-folder section makes import order independent
# of the package name.
[tool.ruff.lint.isort]
known-local-folder = ["support"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"os.environ".msg = "Config is injected; never read the environment directly."
"os.getenv".msg = "Config is injected; never read the environment directly."

[tool.ruff.lint.per-file-ignores]
# D deliberately stays ON in tests: a test's docstring states what it proves.
"tests/**" = [
    "PLR2004",  # magic values are fine in assertions
    "ANN",      # fixture/test signatures stay unannotated-friendly (ty still checks bodies)
    "FBT",      # fixtures pass flags positionally
]

# ---------------------------------------------------------------------------
# Types — ty is the sole type gate (no pyright/mypy)
# ---------------------------------------------------------------------------

[tool.ty.environment]
python-version = "3.13"
root = [
    "src",
    "tests",  # resolves the `support` test-helper package (pytest pythonpath twin)
]

[tool.ty.rules]
all = "error"
unresolved-import = "warn"  # third-party stubs are sometimes missing

[tool.ty.src]
include = ["src", "tests"]
# make_golden_old.py imports the pre-port package from the originating project; it is excluded here because that package is not installable.
exclude = [
    "tests/golden/make_golden_old.py",
]

# ---------------------------------------------------------------------------
# Dead code (run weekly, warn-level — not a commit gate)
# ---------------------------------------------------------------------------

[tool.vulture]
paths = ["src"]
min_confidence = 80

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config -q"
pythonpath = ["tests"]
filterwarnings = ["error"]
xfail_strict = true
markers = ["golden: slow parity tests"]
personal_terms_file = "~/personal/pyntpot-private/banned_terms.txt"

# ---------------------------------------------------------------------------
# Coverage — the gate is the CI step in `checks`, see ADR 0011; never set
# `fail_under` here (pytest-cov would apply it to the whole package). Plain
# `uv run pytest` stays coverage-free for fast local loops.
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["pyntpot"]

[tool.coverage.report]
show_missing = true

# ---------------------------------------------------------------------------
# Mutation testing — see ADR 0012. `only_mutate` is the one statement of the
# scope; tests/mutation/scope.py and shard.py read it. mutmut runs pytest inside
# `mutants/`, where `support.REPO_ROOT` is the mutated tree, so the selection
# is the unit and property tests only:
# - tests/architecture would scan the trampolined source: the line budget fails
#   on every mutated file, and the injected `mutmut` import and `# type: ignore`
#   lines break other checks.
# - tests/golden is too slow per mutant.
# - tests/mutation tests the helper scripts, not `src`.
# - tests/benchmarks times code and asserts nothing.
# `forkserver` runs each pytest call in a fresh process. Under the default `fork`,
# mutmut runs pytest more than once in one process and forks mutants from it, so
# Hypothesis sees a second instance of each property-test class and fails its
# `differing_executors` health check: the clean run fails, and a mutant would be
# "killed" by the health check rather than by a test.
# ---------------------------------------------------------------------------

[tool.mutmut]
source_paths = ["src/"]
only_mutate = ["src/pyntpot/ink/*", "src/pyntpot/letters/*"]
pytest_add_cli_args = ["--hypothesis-profile=ci"]
pytest_add_cli_args_test_selection = ["tests/unit", "tests/property", "-m", "not golden"]
process_isolation = "forkserver"

# The two numbers the mutation jobs read: the score floor (set from the first
# full nightly) and the nightly's shard count (set from measured timings).
[tool.pyntpot.mutation]
min_score = 0.0
shards = 4
